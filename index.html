<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Ads Analytics 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#EE4D2D">
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Shopee Ads Analytics</h1>
            <p>Sistem Pemrosesan Edge (100% Offline)</p>
        </header>

        <!-- Navigasi Mode Input -->
        <div class="tabs">
            <button id="btnTabUpload" class="tab-btn active">📂 Upload File</button>
            <button id="btnTabManual" class="tab-btn">✍️ Input Manual</button>
        </div>

        <!-- Mode 1: Upload File -->
        <div id="uploadSection" class="input-section active-section">
            <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
            <label for="fileInput" class="action-btn">Pilih Laporan Iklan</label>
        </div>

        <!-- Mode 2: Input Manual -->
        <div id="manualSection" class="input-section">
            <form id="manualForm">
                <div class="form-grid">
                    <input type="text" id="m_nama" placeholder="Nama Produk (Contoh: Diorio Pants)" required>
                    <input type="number" id="m_biaya" placeholder="Biaya Iklan (Rp)" required>
                    <input type="number" id="m_penjualan" placeholder="Penjualan (Rp)" required>
                    <input type="number" id="m_dilihat" placeholder="Jumlah Dilihat" required>
                    <input type="number" id="m_klik" placeholder="Jumlah Klik" required>
                    <input type="number" id="m_pesanan" placeholder="Jumlah Pesanan" required>
                </div>
                <button type="submit" class="action-btn submit-btn">➕ Tambah ke Dashboard</button>
                <button type="button" id="btnReset" class="action-btn reset-btn">🗑️ Reset Data</button>
            </form>
        </div>

        <!-- Dashboard KPI -->
        <div class="kpi-grid">
            <div class="card"><h3>Total Biaya</h3><h2 id="totalBiaya">Rp 0</h2></div>
            <div class="card"><h3>Total Penjualan</h3><h2 id="totalPenjualan">Rp 0</h2></div>
            <div class="card"><h3>Avg ROAS</h3><h2 id="avgRoas">0x</h2></div>
            <div class="card"><h3>Avg Konversi</h3><h2 id="avgKonversi">0%</h2></div>
        </div>

        <!-- Area Visualisasi -->
        <div class="chart-container">
            <canvas id="roasChart"></canvas>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
